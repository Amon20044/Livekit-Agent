name: Deploy Agent To EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to deploy"
        default: "main"
      ssh_port:
        description: "SSH port"
        default: "22"

env:
  APP_DIR: "/opt/my-agent"
  SSH_PORT: ${{ inputs.ssh_port || '22' }}
  ENV_FILE: "/opt/my-agent/.env.local"
  IMAGE_NAME: "my-agent"
  CONTAINER_NAME: "my-agent"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup SSH
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$EC2_HOST" ]; then
            echo "::error::Missing required repository secret: EC2_HOST"
            exit 1
          fi
          if [ -z "$EC2_PRIVATE_KEY" ]; then
            echo "::error::Missing required repository secret: EC2_PRIVATE_KEY"
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf "%s\n" "$EC2_PRIVATE_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keygen -y -f ~/.ssh/ec2_key >/dev/null
          ssh-keyscan -p "${{ env.SSH_PORT }}" -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify SSH access
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          if [ -z "$EC2_USER" ]; then
            echo "::error::Missing required repository secret: EC2_USER"
            exit 1
          fi

          SSH="ssh -i ~/.ssh/ec2_key -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -p ${{ env.SSH_PORT }}"
          if ! $SSH "$EC2_USER@$EC2_HOST" "echo ssh-ready"; then
            echo "::error::SSH authentication failed. Check EC2_USER, EC2_HOST, EC2_PRIVATE_KEY, and that the key's public half is in ~/.ssh/authorized_keys on the EC2 host."
            exit 1
          fi

      - name: Deploy
        shell: bash
        env:
          ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL || vars.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          LIVEKIT_AGENT_NAME: ${{ vars.LIVEKIT_AGENT_NAME || 'my-agent' }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || 'cgSgspJ2msm6clMCkdW9' }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          DEEPGRAM_STT_MODEL: ${{ vars.DEEPGRAM_STT_MODEL || 'nova-3-general' }}
          DEEPGRAM_STT_LANGUAGE: ${{ vars.DEEPGRAM_STT_LANGUAGE || 'en' }}
          GEMINI_LLM_MODEL: ${{ vars.GEMINI_LLM_MODEL || 'gemini-2.5-flash-lite' }}
          ELEVENLABS_TTS_MODEL: ${{ vars.ELEVENLABS_TTS_MODEL || 'eleven_multilingual_v2' }}
          ELEVENLABS_TTS_LANGUAGE: ${{ vars.ELEVENLABS_TTS_LANGUAGE || 'en' }}
          PREEMPTIVE_GENERATION: ${{ vars.PREEMPTIVE_GENERATION || 'true' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
          DEBUG_MODE: ${{ vars.DEBUG_MODE || 'false' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail

          # Package only what Docker needs. The env file is uploaded separately
          # from GitHub secrets/variables so it never has to be committed.
          FILES="Dockerfile .dockerignore pyproject.toml uv.lock src/"
          tar -czf /tmp/my-agent.tar.gz $FILES

          write_env() {
            local name="$1"
            local value="${2:-}"
            if [ -n "$value" ]; then
              printf "%s=%s\n" "$name" "$value" >> /tmp/my-agent.env.local
            fi
          }

          require_env() {
            local name="$1"
            local value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing required repository secret or variable: $name"
              exit 1
            fi
          }

          if [ -n "${ENV_LOCAL:-}" ]; then
            printf "%s\n" "$ENV_LOCAL" > /tmp/my-agent.env.local
          else
            require_env LIVEKIT_API_KEY
            require_env LIVEKIT_API_SECRET
            require_env SERPAPI_API_KEY
            require_env GOOGLE_API_KEY
            require_env DEEPGRAM_API_KEY
            if [ -z "${ELEVENLABS_API_KEY:-}" ] && [ -z "${ELEVEN_API_KEY:-}" ]; then
              echo "::error::Missing required repository secret: ELEVENLABS_API_KEY or ELEVEN_API_KEY"
              exit 1
            fi

            : > /tmp/my-agent.env.local
            write_env LIVEKIT_URL "${LIVEKIT_URL:-ws://localhost:7880}"
            write_env LIVEKIT_API_KEY "$LIVEKIT_API_KEY"
            write_env LIVEKIT_API_SECRET "$LIVEKIT_API_SECRET"
            write_env LIVEKIT_AGENT_NAME "${LIVEKIT_AGENT_NAME:-my-agent}"
            write_env SERPAPI_API_KEY "$SERPAPI_API_KEY"
            write_env GOOGLE_API_KEY "$GOOGLE_API_KEY"
            write_env ELEVENLABS_API_KEY "$ELEVENLABS_API_KEY"
            write_env ELEVEN_API_KEY "$ELEVEN_API_KEY"
            write_env ELEVENLABS_VOICE_ID "${ELEVENLABS_VOICE_ID:-cgSgspJ2msm6clMCkdW9}"
            write_env DEEPGRAM_API_KEY "$DEEPGRAM_API_KEY"
            write_env DEEPGRAM_STT_MODEL "${DEEPGRAM_STT_MODEL:-nova-3-general}"
            write_env DEEPGRAM_STT_LANGUAGE "${DEEPGRAM_STT_LANGUAGE:-en}"
            write_env GEMINI_LLM_MODEL "${GEMINI_LLM_MODEL:-gemini-2.5-flash-lite}"
            write_env ELEVENLABS_TTS_MODEL "${ELEVENLABS_TTS_MODEL:-eleven_multilingual_v2}"
            write_env ELEVENLABS_TTS_LANGUAGE "${ELEVENLABS_TTS_LANGUAGE:-en}"
            write_env PREEMPTIVE_GENERATION "${PREEMPTIVE_GENERATION:-true}"
            write_env LOG_LEVEL "${LOG_LEVEL:-info}"
            write_env DEBUG_MODE "${DEBUG_MODE:-false}"
          fi
          chmod 600 /tmp/my-agent.env.local

          # Single SSH session: upload, build, run
          SSH="ssh -i ~/.ssh/ec2_key -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -p ${{ env.SSH_PORT }}"
          SCP="scp -i ~/.ssh/ec2_key -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -C -P ${{ env.SSH_PORT }}"

          $SCP /tmp/my-agent.tar.gz "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/my-agent.tar.gz"
          $SCP /tmp/my-agent.env.local "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/my-agent.env.local"

          $SSH "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "
            set -euo pipefail

            # Stop old agent
            sudo docker stop '${{ env.CONTAINER_NAME }}' 2>/dev/null || true
            sudo docker rm -f '${{ env.CONTAINER_NAME }}' 2>/dev/null || true

            # Free memory only when disk is low (< 1 GB free)
            FREE_KB=\$(df /var/lib/docker 2>/dev/null | awk 'NR==2{print \$4}' || echo 9999999)
            if [ \"\$FREE_KB\" -lt 1048576 ]; then
              echo 'Low disk — pruning docker images and build cache...'
              sudo docker rmi -f '${{ env.IMAGE_NAME }}' 2>/dev/null || true
              sudo docker image prune -f 2>/dev/null || true
              sudo docker builder prune -af 2>/dev/null || true
            fi

            # Extract new code over existing directory
            sudo mkdir -p '${{ env.APP_DIR }}'
            sudo tar -xzf /tmp/my-agent.tar.gz -C '${{ env.APP_DIR }}'
            sudo chown -R '${{ secrets.EC2_USER }}':'${{ secrets.EC2_USER }}' '${{ env.APP_DIR }}'
            rm -f /tmp/my-agent.tar.gz

            # Install env file generated from GitHub secrets/variables.
            sudo mv /tmp/my-agent.env.local '${{ env.ENV_FILE }}'
            sudo chmod 600 '${{ env.ENV_FILE }}'
            sudo chown '${{ secrets.EC2_USER }}':'${{ secrets.EC2_USER }}' '${{ env.ENV_FILE }}'

            # Build and run
            cd '${{ env.APP_DIR }}'
            sudo docker build --no-cache -t '${{ env.IMAGE_NAME }}' .
            sudo docker run -d \
              --name '${{ env.CONTAINER_NAME }}' \
              --network host \
              --env-file '${{ env.ENV_FILE }}' \
              --restart unless-stopped \
              '${{ env.IMAGE_NAME }}'
          "

      - name: Wait for agent to register
        shell: bash
        timeout-minutes: 3
        run: |
          SSH="ssh -i ~/.ssh/ec2_key -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=10 -p ${{ env.SSH_PORT }}"
          RESULT="FAIL"
          REASON=""
          for i in $(seq 1 30); do
            LOGS=$($SSH "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
              "sudo docker logs '${{ env.CONTAINER_NAME }}' 2>&1" || true)

            if echo "$LOGS" | grep -q 'registered worker'; then
              RESULT="SUCCESS"
              break
            fi

            # Early fail: detect fatal errors instead of waiting the full timeout
            if echo "$LOGS" | grep -q 'exit code -9'; then
              REASON="OOM: process killed (exit code -9). Instance needs more memory."
              break
            fi
            if echo "$LOGS" | grep -q '401.*Invalid response status'; then
              REASON="AUTH: 401 Unauthorized. LIVEKIT_API_KEY/SECRET don't match the livekit server config."
              break
            fi
            if echo "$LOGS" | grep -q 'Connection refused'; then
              REASON="CONN: LiveKit server not reachable at ws://localhost:7880."
              break
            fi
            if ! $SSH "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
              "sudo docker ps -q --filter name='${{ env.CONTAINER_NAME }}' | grep -q ." 2>/dev/null; then
              REASON="CRASH: Container exited."
              break
            fi

            echo "Attempt $i/30 - waiting 5s..."
            sleep 5
          done

          echo ""
          echo "========================================="
          if [ "$RESULT" = "SUCCESS" ]; then
            echo "  DEPLOY RESULT: SUCCESS"
          else
            echo "  DEPLOY RESULT: FAILED"
            if [ -n "$REASON" ]; then
              echo "  REASON: $REASON"
            else
              echo "  REASON: Agent did not register within timeout."
            fi
          fi
          echo "========================================="
          echo ""
          echo "=== Container logs ==="
          $SSH "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo docker logs --tail 40 '${{ env.CONTAINER_NAME }}' 2>&1" || true

          if [ "$RESULT" != "SUCCESS" ]; then
            exit 1
          fi

