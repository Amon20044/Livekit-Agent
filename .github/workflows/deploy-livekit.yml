name: Deploy LiveKit Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'livekit.amonsharma.com/**'
      - '.github/workflows/deploy-livekit.yml'
  workflow_dispatch:
    inputs:
      ssh_port:
        description: "SSH port"
        default: "22"

env:
  LIVEKIT_DIR: "/opt/livekit"
  SSH_PORT: ${{ inputs.ssh_port || '22' }}
  CONFIG_DIR: "livekit.amonsharma.com"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$EC2_HOST" ]; then
            echo "::error::Missing required repository secret: EC2_HOST"
            exit 1
          fi
          if [ -z "$EC2_PRIVATE_KEY" ]; then
            echo "::error::Missing required repository secret: EC2_PRIVATE_KEY"
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf "%s\n" "$EC2_PRIVATE_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keygen -y -f ~/.ssh/ec2_key >/dev/null
          ssh-keyscan -p "${{ env.SSH_PORT }}" -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify SSH access
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          if [ -z "$EC2_USER" ]; then
            echo "::error::Missing required repository secret: EC2_USER"
            exit 1
          fi

          SSH="ssh -i ~/.ssh/ec2_key -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -p ${{ env.SSH_PORT }}"
          if ! $SSH "$EC2_USER@$EC2_HOST" "echo ssh-ready"; then
            echo "::error::SSH authentication failed. Check EC2_USER, EC2_HOST, EC2_PRIVATE_KEY, and that the key's public half is in ~/.ssh/authorized_keys on the EC2 host."
            exit 1
          fi

      - name: Deploy LiveKit infrastructure
        timeout-minutes: 10
        env:
          ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
        run: |
          set -euo pipefail
          if [ -z "${ENV_LOCAL:-}" ]; then
            echo "::error::Missing required repository secret: ENV_LOCAL"
            echo "::error::ENV_LOCAL must contain the full .env.local file contents."
            exit 1
          fi
          printf "%s\n" "$ENV_LOCAL" > /tmp/my-agent.env.local
          chmod 600 /tmp/my-agent.env.local

          SSH="ssh -i ~/.ssh/ec2_key -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -p ${{ env.SSH_PORT }}"
          SCP="scp -i ~/.ssh/ec2_key -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -C -P ${{ env.SSH_PORT }}"
          REMOTE="${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"

          # Package config files
          tar -czf /tmp/livekit-configs.tar.gz -C "${{ env.CONFIG_DIR }}" \
            livekit.yaml caddy.yaml docker-compose.yaml redis.conf update_ip.sh livekit-docker.service

          # Upload
          $SCP /tmp/livekit-configs.tar.gz "$REMOTE:/tmp/livekit-configs.tar.gz"
          $SCP /tmp/my-agent.env.local "$REMOTE:/tmp/my-agent.env.local"

          # Apply configs and restart
          $SSH "$REMOTE" "
            set -euo pipefail

            # Stop existing livekit services
            sudo systemctl stop livekit-docker 2>/dev/null || true

            # Clear config files but preserve caddy_data (TLS certs) and caddy_data contents
            cd '${{ env.LIVEKIT_DIR }}' 2>/dev/null && \
              sudo find . -maxdepth 1 -not -name caddy_data -not -name '.' -delete 2>/dev/null || true
            sudo mkdir -p '${{ env.LIVEKIT_DIR }}/caddy_data'

            # Extract new configs
            sudo tar -xzf /tmp/livekit-configs.tar.gz -C '${{ env.LIVEKIT_DIR }}'
            sudo chmod 755 '${{ env.LIVEKIT_DIR }}/update_ip.sh'
            rm -f /tmp/livekit-configs.tar.gz

            # Install the exact ENV_LOCAL secret for the agent and derive
            # LiveKit service configs from the same keypair.
            if [ -f /tmp/my-agent.env.local ]; then
              sudo install -m 600 -o '${{ secrets.EC2_USER }}' -g '${{ secrets.EC2_USER }}' /tmp/my-agent.env.local /etc/my-agent.env
              rm -f /tmp/my-agent.env.local
            elif [ -f /etc/my-agent.env ]; then
              echo 'ENV upload missing; reusing existing /etc/my-agent.env'
              sudo chmod 600 /etc/my-agent.env
              sudo chown '${{ secrets.EC2_USER }}':'${{ secrets.EC2_USER }}' /etc/my-agent.env
            else
              echo 'Missing /tmp/my-agent.env.local and no existing /etc/my-agent.env to reuse.'
              exit 1
            fi
            if [ -d /opt/my-agent ]; then
              sudo cp /etc/my-agent.env /opt/my-agent/.env.local
              sudo chmod 600 /opt/my-agent/.env.local
              sudo chown '${{ secrets.EC2_USER }}':'${{ secrets.EC2_USER }}' /opt/my-agent/.env.local
            fi

            set -a
            . /etc/my-agent.env
            set +a
            : \"\${LIVEKIT_API_KEY:?LIVEKIT_API_KEY missing from ENV_LOCAL}\"
            : \"\${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET missing from ENV_LOCAL}\"
            LIVEKIT_PUBLIC_URL=\"\${LIVEKIT_PUBLIC_URL:-wss://livekit.amonsharma.com}\"

            sudo env LIVEKIT_API_KEY=\"\$LIVEKIT_API_KEY\" LIVEKIT_API_SECRET=\"\$LIVEKIT_API_SECRET\" python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path('/opt/livekit/livekit.yaml')
          text = path.read_text()
          replacement = f\"keys:\\n    {os.environ['LIVEKIT_API_KEY']}: {os.environ['LIVEKIT_API_SECRET']}\\n\"
          if re.search(r'(?ms)^keys:\\n(?:^[ \\t]+[^\\n]*\\n?)+', text):
              text = re.sub(r'(?ms)^keys:\\n(?:^[ \\t]+[^\\n]*\\n?)+', replacement, text)
          else:
              text = text.rstrip() + \"\\n\" + replacement
          path.write_text(text)
          PY

            sudo rm -rf '${{ env.LIVEKIT_DIR }}/egress.yaml' '${{ env.LIVEKIT_DIR }}/ingress.yaml'
            sudo tee '${{ env.LIVEKIT_DIR }}/egress.yaml' >/dev/null <<EOF
          redis:
            address: localhost:6379
          api_key: \${LIVEKIT_API_KEY}
          api_secret: \${LIVEKIT_API_SECRET}
          ws_url: \${LIVEKIT_PUBLIC_URL}
          EOF
            sudo tee '${{ env.LIVEKIT_DIR }}/ingress.yaml' >/dev/null <<EOF
          redis:
            address: localhost:6379
          api_key: \${LIVEKIT_API_KEY}
          api_secret: \${LIVEKIT_API_SECRET}
          ws_url: \${LIVEKIT_PUBLIC_URL}
          rtmp_port: 1935
          whip_port: 8080
          http_relay_port: 9090
          rtc_config:
            udp_port: 7885
            use_external_ip: true
            enable_loopback_candidate: false
          EOF
            sudo chmod 600 '${{ env.LIVEKIT_DIR }}/egress.yaml' '${{ env.LIVEKIT_DIR }}/ingress.yaml'

            # Install systemd service
            sudo cp '${{ env.LIVEKIT_DIR }}/livekit-docker.service' /etc/systemd/system/livekit-docker.service

            # Patch caddy.yaml with instance public IP
            sudo '${{ env.LIVEKIT_DIR }}/update_ip.sh'

            # Install docker-compose if missing
            if ! command -v docker-compose &>/dev/null && [ ! -f /usr/local/bin/docker-compose ]; then
              echo 'Installing docker-compose...'
              sudo curl -sL \"https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-\$(uname -s)-\$(uname -m)\" -o /usr/local/bin/docker-compose
              sudo chmod 755 /usr/local/bin/docker-compose
            fi

            # Reload and restart
            sudo systemctl daemon-reload
            sudo systemctl enable docker
            sudo systemctl start docker
            sudo systemctl enable livekit-docker
            sudo systemctl start livekit-docker
          "

      - name: Verify LiveKit is running
        timeout-minutes: 3
        run: |
          SSH="ssh -i ~/.ssh/ec2_key -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=10 -p ${{ env.SSH_PORT }}"
          REMOTE="${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          RESULT="FAIL"

          for i in $(seq 1 15); do
            RUNNING=$($SSH "$REMOTE" \
              "sudo docker ps --filter status=running --format '{{.Names}}' | grep -c -E 'caddy|livekit|redis|sip'" 2>/dev/null || echo 0)

            if [ "$RUNNING" -ge 3 ]; then
              RESULT="SUCCESS"
              break
            fi

            echo "Attempt $i/15 - $RUNNING/4 containers running, waiting 5s..."
            sleep 5
          done

          echo ""
          echo "========================================="
          if [ "$RESULT" = "SUCCESS" ]; then
            echo "  LIVEKIT DEPLOY: SUCCESS"
          else
            echo "  LIVEKIT DEPLOY: FAILED"
          fi
          echo "========================================="
          echo ""
          echo "=== Container status ==="
          $SSH "$REMOTE" "sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'" || true

          if [ "$RESULT" != "SUCCESS" ]; then
            echo ""
            echo "=== Docker compose logs ==="
            $SSH "$REMOTE" "cd /opt/livekit && sudo docker-compose logs --tail 20" 2>/dev/null || true
            exit 1
          fi
