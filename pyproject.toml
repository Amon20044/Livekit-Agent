[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "woice-ai-agent"
version = "1.0.0"
description = "Woice AI waitlist voice agent built with LiveKit Agents for Python"
requires-python = ">=3.10, <3.15"

dependencies = [
    "livekit",
    "livekit-agents[aws,elevenlabs,google,groq,sarvam,silero,speechmatics]~=1.5",
    "livekit-plugins-turn-detector",
    "python-dotenv>=1.0",
    "annotated-types",
    "aiohttp>=3.9",
    "sentencepiece",
    "livekit-plugins-ai-coustics>=0.2.13",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
